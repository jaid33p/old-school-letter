<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Title + link preview (what shows when you paste the link in an email / chat) -->
  <title>A Letter for You</title>
  <meta name="description" content="Someone has sent you a letter. Break the seal to read it." />
  <meta property="og:title" content="A Letter for You" />
  <meta property="og:description" content="Someone has sent you a letter. Break the seal to read it." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#2a1a10" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Homemade+Apple&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ╔══════════════════════════════════════════════════════════════════╗
     ║  1) ENVELOPE SETTINGS — edit the values in quotes                ║
     ╚══════════════════════════════════════════════════════════════════╝ -->
<div id="letter-config" hidden
     data-seal-initial="J"
     data-envelope-to="For You"
     data-kicker="You have received a letter"
     data-typing-speed="1"
     data-stamp-seal="true"></div>
<!-- data-typing-speed: 1 = normal, 2 = twice as fast, 0.5 = slower -->
<!-- data-stamp-seal:   "true" stamps a small wax seal at the bottom when the letter finishes -->


<!-- ╔══════════════════════════════════════════════════════════════════╗
     ║  2) YOUR LETTER — paste your content between the markers         ║
     ║     Each paragraph goes inside its own <p> ... </p>              ║
     ║     Delete any line you don't need (date, P.S., etc.)            ║
     ╚══════════════════════════════════════════════════════════════════╝ -->
<template id="letter-source">
<!-- ▼▼▼ START OF LETTER ▼▼▼ -->

  <p class="date">Montréal 2026</p>

  <p class="salutation">Hello sister/second mother,</p>

  <p>I thought of writing a physical letter just like you but that would take a lot of time so just made this for you. Writing a little appreciation letter for you! I know I might not say it all the or act like it but I do really miss you every single day…I might not call or text all the time cuz I know you will LOL and it does mean a lot. All I know and what makes me ME is what I learned from you and I do make sure everyone here knows that. You are quite the celebrity over here and people tell me all the time that they could tell I was raised with an elder sister by the way I act and do things which means you definitely did something right :)</p>

  <p>I would love to have you here and show you around which might seem more and more improbable as we go but eh one can hope! I am also aware of all the sacrifices that you have to make in order for me do what I am doing right now, for which I cannot thank you enough(and yes you will be rewarded with all the designer stuff that you may desire SOMEDAY ONE DAY FOR SURE). I am able to stay strong here because you are holding down the fort back home which is a very difficult thing to do but you still do it day-in day-out. And yes I am not opposed to coming back home its just need to try my hardest here and see where that gets me but I know that I can always come home which is a great safety net to have which most people don’t.</p>

  <p>I do really miss all the laughs and fun we had together, all the late night after dinner car rides for more food, all the shopping, all the VELLA-PANTI we were able to do. And don’t worry I won’t let the kid inside me go anywhere cuz no matter how old I get I will always be a likkle baby in your eyes. To end this letter I will just say that I am super proud of what you have been able to achieve and do in your life which is an inspiration for me.</p>

  <p class="closing">With all my love,</p>

  <p class="signature">JD</p>

<!-- ▲▲▲ END OF LETTER ▲▲▲ -->
</template>


<!-- ─────────────────── You don't need to edit below this line ─────────────────── -->

<button id="sound-toggle" class="sound-toggle" type="button" aria-pressed="false" aria-label="Turn sound on" title="Sound">
  <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 010 7M18.8 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
</button>

<section id="intro" class="intro">
  <p class="intro-kicker" id="intro-kicker"></p>

  <div class="envelope" id="envelope">
    <div class="env-back"></div>
    <div class="env-letter"></div>
    <div class="env-pocket-wrap"><div class="env-pocket"></div></div>
    <div class="env-flap-wrap"><div class="env-flap"></div></div>
    <p class="env-to" id="envelope-to"></p>

    <button class="seal" id="seal" type="button" aria-label="Break the seal and open the letter">
      <span class="seal-half seal-left"><span class="seal-face"><span class="seal-initial"></span></span></span>
      <span class="seal-half seal-right"><span class="seal-face"><span class="seal-initial"></span></span></span>
    </button>
  </div>

  <p class="intro-hint">Break the seal to open</p>
</section>

<main id="letter-view" class="letter-view" hidden>
  <article class="paper" id="paper" aria-live="off"></article>
  <div class="end-controls">
    <button id="replay" class="text-btn" type="button" hidden>Open it again</button>
  </div>
</main>

<button id="skip" class="skip-btn" type="button" hidden>Skip typing &rsaquo;</button>

<script src="script.js"></script>
</body>
</html>
